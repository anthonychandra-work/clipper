<title>Clipper Prototype 4</title>
<style>
  /* Layout: a glass sidebar and toolbar over a split view of clips, preview and inspector; at phone width a tab bar, pushed screens and a bottom toolbar. */
  :root {
    --page: #F2F2F7;
    --group: #FFFFFF;
    --sheet: #F2F2F7;
    --sheet-group: #FFFFFF;
    --label: #000000;
    --label-2: rgb(60 60 67 / 0.76);
    --label-3: rgb(60 60 67 / 0.5);
    --placeholder: rgb(60 60 67 / 0.72);
    --separator: rgb(60 60 67 / 0.2);
    --fill: rgb(120 120 128 / 0.12);
    --fill-strong: rgb(120 120 128 / 0.22);
    --hover: rgb(120 120 128 / 0.1);
    --segment: #FFFFFF;
    --thumb: #FFFFFF;
    --gray: #8E8E93;

    --accent: #0088FF;
    --accent-fill: #0071E3;
    --accent-ink: #FFFFFF;
    --accent-text: #0066CC;
    --selection: rgb(0 136 255 / 0.14);
    --focus: rgb(0 136 255 / 0.55);
    --green: #34C759;
    --green-text: #007A2C;
    --green-soft: rgb(52 199 89 / 0.18);
    --red-text: #C8102A;
    --red-soft: rgb(255 56 60 / 0.14);
    --orange-text: #B24800;
    --orange-soft: rgb(255 141 40 / 0.16);
    --yellow: #FFCC00;
    --yellow-ink: #1B1700;
    --trim-rest: #1C1C1E;
    --trim-rest-ink: #FFFFFF;

    --glass: rgb(255 255 255 / 0.82);
    --glass-edge: rgb(255 255 255 / 0.85);
    --glass-rim: rgb(0 0 0 / 0.08);
    --glass-shadow: rgb(0 0 0 / 0.1);
    --glass-blur: blur(20px) saturate(180%);
    --sidebar: rgb(249 249 252 / 0.8);
    --scroll-edge: rgb(242 242 247 / 0.88);
    --dim: rgb(0 0 0 / 0.32);
    --shadow: rgb(0 0 0 / 0.16);

    --frame: #0B0D12;
    --stage-far: #303B5E;
    --stage-near: #131827;
    --stage-alt: #3D2F45;
    --figure-skin: #D8C2A7;
    --figure-cloth: #5568A8;
    --figure-cloth-alt: #9A5B6E;
    --overlay-paper: #FFFFFF;
    --overlay-ink: #111318;
    --video-ink: #FFFFFF;
    --video-shadow: #000000;
    --video-highlight: #FFD600;
    --video-guide: rgb(255 255 255 / 0.7);
    --video-guide-fill: rgb(255 255 255 / 0.15);
    --video-glass: rgb(255 255 255 / 0.2);
    --video-glass-edge: rgb(255 255 255 / 0.34);
    --video-dim: rgb(0 0 0 / 0.35);
    --video-shade: rgb(0 0 0 / 0.6);

    --font: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-rounded: ui-rounded, -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --text-large: 2.125rem;
    --text-title: 1.375rem;
    --text-headline: 1.0625rem;
    --text-body: 1.0625rem;
    --text-subhead: 0.9375rem;
    --text-footnote: 0.8125rem;
    --text-caption: 0.75rem;
    --weight-headline: 600;

    --control: 44px;
    --control-small: 34px;
    --bar-control: 44px;
    --bar-inset: 16px;
    --bar-pad: 8px;
    --bar-height: calc(var(--bar-control) + 2 * var(--bar-pad));
    --edge-fade: 16px;
    --row: 48px;
    --switch-width: 51px;
    --switch-height: 31px;
    --radius-control: 999px;
    --radius-segmented: 18px;
    --radius-group: 22px;
    --radius-menu: 20px;
    --pin-size: 30px;
    --pin-step: 48px;
    --pin-reach: -7px;
    --gutter: 16px;
  }

  @media (min-width: 720px) and (hover: hover) and (pointer: fine) {
    :root {
      --text-large: 1.625rem;
      --text-title: 1.0625rem;
      --text-headline: 0.8125rem;
      --text-body: 0.8125rem;
      --text-subhead: 0.75rem;
      --text-footnote: 0.75rem;
      --text-caption: 0.75rem;
      --weight-headline: 700;

      --control: 30px;
      --control-small: 24px;
      --bar-control: 34px;
      --bar-inset: 12px;
      --bar-pad: 9px;
      --edge-fade: 6px;
      --row: 34px;
      --switch-width: 38px;
      --switch-height: 22px;
      --radius-control: 7px;
      --radius-segmented: 7px;
      --radius-group: 12px;
      --radius-menu: 12px;
      --pin-size: 26px;
      --pin-step: 31px;
      --pin-reach: 0px;
      --gutter: 20px;
    }
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #000000;
      --group: #1C1C1E;
      --sheet: #1C1C1E;
      --sheet-group: #2C2C2E;
      --label: #FFFFFF;
      --label-2: rgb(235 235 245 / 0.62);
      --label-3: rgb(235 235 245 / 0.36);
      --placeholder: rgb(235 235 245 / 0.52);
      --separator: rgb(84 84 88 / 0.6);
      --fill: rgb(120 120 128 / 0.24);
      --fill-strong: rgb(120 120 128 / 0.36);
      --hover: rgb(120 120 128 / 0.2);
      --segment: #636366;
      --accent: #0091FF;
      --accent-text: #5CB8FF;
      --selection: rgb(0 145 255 / 0.26);
      --focus: rgb(0 145 255 / 0.7);
      --green: #30D158;
      --green-text: #30D158;
      --green-soft: rgb(48 209 88 / 0.2);
      --red-text: #FF7B7E;
      --red-soft: rgb(255 66 69 / 0.22);
      --orange-text: #FF9230;
      --orange-soft: rgb(255 146 48 / 0.2);
      --yellow: #FFD600;
      --trim-rest: #FFFFFF;
      --trim-rest-ink: #1C1C1E;
      --glass: rgb(44 44 46 / 0.8);
      --glass-edge: rgb(255 255 255 / 0.14);
      --glass-rim: rgb(0 0 0 / 0.4);
      --glass-shadow: rgb(0 0 0 / 0.45);
      --sidebar: rgb(28 28 30 / 0.82);
      --scroll-edge: rgb(0 0 0 / 0.78);
      --dim: rgb(0 0 0 / 0.5);
      --shadow: rgb(0 0 0 / 0.5);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --page: #000000;
    --group: #1C1C1E;
    --sheet: #1C1C1E;
    --sheet-group: #2C2C2E;
    --label: #FFFFFF;
    --label-2: rgb(235 235 245 / 0.62);
    --label-3: rgb(235 235 245 / 0.36);
    --placeholder: rgb(235 235 245 / 0.52);
    --separator: rgb(84 84 88 / 0.6);
    --fill: rgb(120 120 128 / 0.24);
    --fill-strong: rgb(120 120 128 / 0.36);
    --hover: rgb(120 120 128 / 0.2);
    --segment: #636366;
    --accent: #0091FF;
    --accent-text: #5CB8FF;
    --selection: rgb(0 145 255 / 0.26);
    --focus: rgb(0 145 255 / 0.7);
    --green: #30D158;
    --green-text: #30D158;
    --green-soft: rgb(48 209 88 / 0.2);
    --red-text: #FF7B7E;
    --red-soft: rgb(255 66 69 / 0.22);
    --orange-text: #FF9230;
    --orange-soft: rgb(255 146 48 / 0.2);
    --yellow: #FFD600;
    --trim-rest: #FFFFFF;
    --trim-rest-ink: #1C1C1E;
    --glass: rgb(44 44 46 / 0.8);
    --glass-edge: rgb(255 255 255 / 0.14);
    --glass-rim: rgb(0 0 0 / 0.4);
    --glass-shadow: rgb(0 0 0 / 0.45);
    --sidebar: rgb(28 28 30 / 0.82);
    --scroll-edge: rgb(0 0 0 / 0.78);
    --dim: rgb(0 0 0 / 0.5);
    --shadow: rgb(0 0 0 / 0.5);
    color-scheme: dark;
  }

  @media (prefers-contrast: more) {
    :root {
      --label-2: rgb(60 60 67 / 0.9);
      --separator: rgb(60 60 67 / 0.45);
      --accent: #1E6EF4;
      --accent-fill: #0058C4;
      --green: #008932;
      --yellow: #A16A00;
      --yellow-ink: #FFFFFF;
    }
  }

  @media (prefers-contrast: more) and (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --label-2: rgb(235 235 245 / 0.82);
      --separator: rgb(120 120 128 / 0.8);
      --accent: #5CB8FF;
      --accent-fill: #5CB8FF;
      --accent-ink: #000000;
      --accent-text: #5CB8FF;
      --green: #4AD968;
      --green-text: #4AD968;
      --orange-text: #FFA056;
      --yellow: #FEDF43;
      --yellow-ink: #1B1700;
    }
  }

  @media (prefers-contrast: more) {
    :root[data-theme="dark"] {
      --label-2: rgb(235 235 245 / 0.82);
      --separator: rgb(120 120 128 / 0.8);
      --accent: #5CB8FF;
      --accent-fill: #5CB8FF;
      --accent-ink: #000000;
      --accent-text: #5CB8FF;
      --green: #4AD968;
      --green-text: #4AD968;
      --orange-text: #FFA056;
      --yellow: #FEDF43;
      --yellow-ink: #1B1700;
    }
  }

  @media (prefers-reduced-transparency: reduce) {
    :root {
      --glass: #FFFFFF;
      --glass-blur: none;
      --sidebar: #F9F9FC;
      --scroll-edge: #F2F2F7;
    }
  }

  @media (prefers-reduced-transparency: reduce) and (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --glass: #2C2C2E;
      --sidebar: #1C1C1E;
      --scroll-edge: #000000;
    }
  }

  @media (prefers-reduced-transparency: reduce) {
    :root[data-theme="dark"] {
      --glass: #2C2C2E;
      --sidebar: #1C1C1E;
      --scroll-edge: #000000;
    }
  }

  body {
    background: var(--page);
    color: var(--label);
    font-family: var(--font);
    font-size: var(--text-body);
    line-height: 1.3;
  }
</style>
